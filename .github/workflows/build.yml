name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Build release
        run: make release SWIFT_BUILD="swift build --disable-sandbox"

      - name: Verify bundle
        run: |
          file "dist/Squirrel Panel.app/Contents/MacOS/SquirrelPanel"
          plutil -lint "dist/Squirrel Panel.app/Contents/Info.plist"

      # 注：DMG 与发布说明由本地 `gh release create` 创建并只挂 DMG，
      # 不在 CI 自动上传 zip / 自动生成说明，以遵守「GitHub Release 只挂 DMG」约定。
