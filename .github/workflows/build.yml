name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build release
        run: make release SWIFT_BUILD="swift build --disable-sandbox"

      - name: Verify bundle
        run: |
          file "dist/Squirrel Panel.app/Contents/MacOS/SquirrelPanel"
          plutil -lint "dist/Squirrel Panel.app/Contents/Info.plist"

      - name: Zip artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ditto -c -k --keepParent "dist/Squirrel Panel.app" "Squirrel-Panel.zip"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Squirrel-Panel.zip
          generate_release_notes: true
